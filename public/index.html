<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>自用选股-盈亏查看工具</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="app">
  <!-- ============ NAVBAR ============ -->
  <nav class="navbar">
    <a href="#" class="logo">
      <svg class="logo-svg" viewBox="0 0 28 28" width="28" height="28"><rect x="2" y="2" width="24" height="24" rx="6" fill="url(#lgGrad)"/><defs><linearGradient id="lgGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e74c3c"/><stop offset="100%" stop-color="#ff8f00"/></linearGradient></defs><path d="M8 18 L12 12 L16 15 L22 8" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="22" cy="8" r="2" fill="#fff"/></svg>
      <span class="logo-text">自用选股-盈亏查看工具</span>
    </a>
    <div class="search-box">
      <input class="search-input" id="searchInput" type="text"
             placeholder="搜索股票名称/代码" autocomplete="off" />
      <span class="search-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
      <div class="search-dropdown" id="searchDropdown"></div>
    </div>
    <div class="navbar-indices" id="navbarIndices"></div>
    <div class="api-badge loading" id="apiBadge">● 连接中</div>
    <div class="time-display" id="timeDisplay">--:--:--</div>
  </nav>

  <!-- ============ MAIN ============ -->
  <div class="main-body">
    <!-- ---- LEFT SIDEBAR ---- -->
    <aside class="sidebar-left">
      <div class="sidebar-tabs">
        <div class="sidebar-tab active" data-tab="watchlist">自选股</div>
        <div class="sidebar-tab" data-tab="portfolio">持仓</div>
      </div>

      <!-- Watchlist Panel -->
      <div class="sidebar-panel active" id="panelWatchlist">
        <div class="watchlist" id="watchlist"></div>
      </div>

      <!-- Portfolio Panel -->
      <div class="sidebar-panel" id="panelPortfolio">
        <div class="portfolio-toolbar">
          <div class="pf-toggle">
            <span>盈亏比例</span>
            <div class="pf-toggle-switch" id="pctToggle"></div>
          </div>
          <button class="pf-add-group-btn" id="addGroupBtn" title="新建分组"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> 分组</button>
        </div>
        <div class="portfolio-list" id="portfolioList"></div>
        <div class="portfolio-summary" id="portfolioSummary"></div>
        <button class="pf-curve-btn" id="pfCurveBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg> 盈亏曲线</button>
      </div>
    </aside>

    <!-- 盈亏曲线弹窗 -->
    <div class="modal-overlay" id="pnlCurveModal" style="display:none">
      <div class="modal-box" style="max-width:800px;width:90vw">
        <div class="modal-header">
          <span>持仓盈亏曲线</span>
          <span class="modal-close" id="pnlCurveClose">×</span>
        </div>
        <div class="modal-body">
          <div class="pnl-curve-controls">
            <div class="pnl-quick-btns">
              <button class="pnl-quick-btn" data-months="1">近1月</button>
              <button class="pnl-quick-btn active" data-months="3">近3月</button>
              <button class="pnl-quick-btn" data-months="6">近6月</button>
              <button class="pnl-quick-btn" data-months="12">近1年</button>
            </div>
            <span class="pnl-date-sep">|</span>
            <input type="date" id="pnlStartDate" class="pnl-date-input">
            <button id="pnlCurveGo" class="pnl-query-btn">查询</button>
          </div>
          <!-- 分组勾选 + 对比模式 -->
          <div class="pnl-group-bar">
            <div id="pnlGroupChecks" class="pnl-group-checks"></div>
            <div class="pnl-switch-bar">
              <label class="pnl-switch" id="pnlCompareSwitch" style="display:none">
                <input type="checkbox" />
                <span>分组对比</span>
              </label>
              <label class="pnl-switch" id="pnlVirtualSwitch" style="display:none">
                <input type="checkbox" />
                <span>虚拟对比线</span>
              </label>
            </div>
          </div>
          <div id="pnlCurveChart" style="width:100%;height:380px"></div>
        </div>
      </div>
    </div>

    <!-- ---- CENTER ---- -->
    <div class="center-area">
      <div class="stock-header" id="stockHeader"></div>
      <div class="chart-toolbar">
        <button class="period-btn active" data-period="minute">分时</button>
        <button class="period-btn" data-period="daily">日K</button>
        <button class="period-btn" data-period="weekly">周K</button>
        <button class="period-btn" data-period="monthly">月K</button>
        <div class="ma-toggles">
          <button class="ma-btn" data-ma="5">MA5</button>
          <button class="ma-btn" data-ma="10">MA10</button>
          <button class="ma-btn" data-ma="20">MA20</button>
          <button class="ma-btn" data-ma="60">MA60</button>
        </div>
      </div>
      <div class="chart-wrap">
        <div id="klineChart"></div>
        <div class="chart-loading" id="chartLoading">⏳ 加载中...</div>
      </div>
    </div>

    <!-- ---- RIGHT SIDEBAR ---- -->
    <aside class="sidebar-right">
      <div class="rank-tabs">
        <div class="rank-tab active" data-rank="rise">涨幅榜</div>
        <div class="rank-tab" data-rank="fall">跌幅榜</div>
        <div class="rank-tab" data-rank="turn">换手率</div>
      </div>
      <div class="rank-header"><span>名称/代码</span><span id="rankColLabel">涨跌幅</span></div>
      <div class="rank-list" id="rankList"></div>
      <div class="sector-panel">
        <div class="section-title">板块行情（模拟）</div>
        <div class="sector-grid" id="sectorGrid"></div>
      </div>
      <div class="news-panel">
        <div class="section-title">指数相关公告</div>
        <div class="news-list" id="newsList"></div>
      </div>
    </aside>
  </div>

  <!-- ============ BOTTOM INDEX STRIP ============ -->
  <div class="index-strip" id="indexStrip"></div>
</div>

<!-- Toast container -->
<div id="toaster"></div>

<!-- Modal container -->
<div id="modalContainer"></div>

<script src="js/utils.js"></script>
<script src="js/sim-service.js"></script>
<script src="js/api-service.js"></script>
<script src="js/portfolio.js"></script>
<script src="js/chart-service.js"></script>
<script src="js/app.js"></script>
</body>
</html>
